<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="stylee.css">   
    <style>
        body {
            text-align: right;
            background-image: url('https://tse1.mm.bing.net/th/id/OIP.EeJhGNAd9PBXbFskSN7ENgHaE7?rs=1&pid=ImgDetMain&o=7&rm=3') ;
            background-size: 1000px 800px;

            width: 80%;
            height: 80%;
            background-repeat: no-repeat;
        }
    </style>        
</head>
<body> 
    <h1 style="color:#56150d; text-align:left;"  >
        <b><i><u>LOGIN</u></i></b>
    </h1>

    <div class="form-box">
        <form action="/login" method="post">

            <div>
                <label for="username"><b>Username:</b></label>
                <br>
                <input type="text" id="username" name="username" placeholder="Enter your username">
            </div>
            <br>

            <div>
                <label for="password"><b>Password:</b></label>
                <br>
                <input type="password" id="password" name="password" placeholder="Enter your password">
            </div>
            <br>

            <div>
                <button type="submit">Login</button>
            </div>
            <br>
             <p> <b> <i style="color: red;" > If you not login then first login  </i></b> </p>
    

        </form>
    </div>  

    <!-- link to signup page -->
    <a href="signup.html">  <button type="submit">Signup</button></a>  

    
</body>
</html>
